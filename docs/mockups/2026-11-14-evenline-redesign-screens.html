<title>ECP Hub Screen Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: a board of phone frames grouped by journey stage; the page is quiet so the screens carry the colour. */
:root{--page:#F1F2F5;--ink:#111827;--sub:#5B6472;--rule:#DDE0E6;--chip:#FFFFFF;--accent:#E8662A;
  --font:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0B111C;--ink:#F3F4F6;--sub:#9CA3AF;--rule:#273142;--chip:#1A2332;--accent:#FF8142;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0B111C;--ink:#F3F4F6;--sub:#9CA3AF;--rule:#273142;--chip:#1A2332;--accent:#FF8142;color-scheme:dark}
body{background:var(--page);color:var(--ink);font-family:var(--font);padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.lede{color:var(--sub);font-size:14px;margin:6px 0 0;max-width:62ch;line-height:1.6}
.sw{display:flex;background:var(--chip);border:1px solid var(--rule);border-radius:12px;padding:4px}
.sw button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--sub);padding:8px 16px;border-radius:9px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:36px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 20px;justify-items:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
figcaption{font-size:13px;color:var(--sub);font-weight:500}

/* The mock's own tokens: Evenline light and dark, switched by the control above. */
.board{--bg:#F9FAFB;--card:#FFFFFF;--line:#ECEEF2;--tx:#111827;--mu:#6B7280;--pr:#FF8142;--soft:#FFF1E7;--okb:#E3F6EC;--okt:#14693A;--shadow:0 12px 32px rgba(17,24,39,.10)}
.board[data-m="dark"]{--bg:#111827;--card:#1F2937;--line:#2D3748;--tx:#FFFFFF;--mu:#9CA3AF;--pr:#FF8142;--soft:#33291F;--okb:#123524;--okt:#8FE0B4;--shadow:0 12px 32px rgba(0,0,0,.4)}
.board{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
.board[data-f="noto"]{font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
.ph{width:300px;max-width:100%;height:640px;border-radius:34px;background:var(--bg);color:var(--tx);position:relative;overflow:hidden;border:1px solid var(--line);font-size:13px;line-height:1.45;box-shadow:var(--shadow)}
.ph svg{width:18px;height:18px;stroke-width:1.9;vertical-align:-3.5px;flex:none}
.pad{padding:0 18px}
.ab{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px;font-weight:700;font-size:15px}
.ab .g{display:flex;gap:14px;align-items:center}
.ab svg{width:21px;height:21px}
.bar{position:absolute;left:0;right:0;bottom:0;height:66px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
.bar span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mu);font-weight:500}
.bar svg{width:21px;height:21px}
.on{color:var(--pr)!important}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 9px;font-weight:700;font-size:15px}
.hd em{font-style:normal;font-size:12px;font-weight:500;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.cv{border-radius:13px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center}
.cv>svg{width:42px;height:42px;stroke-width:1.4;opacity:.95;position:relative}
.cv:before,.cv:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.17)}
.cv:before{width:180px;height:180px;right:-60px;top:-80px}
.cv:after{width:120px;height:120px;left:-30px;bottom:-70px}
.dt{position:absolute;top:8px;left:8px;background:var(--card);color:var(--tx);border-radius:9px;padding:3px 8px;font-size:10px;text-align:center;line-height:1.2;z-index:1}
.dt b{display:block;font-size:13px}
.meta{color:var(--mu);font-size:11.5px}
.tt{font-weight:700;font-size:15px;margin:2px 0 8px;line-height:1.3}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{background:var(--soft);color:var(--pr);border-radius:9px;padding:6px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.pl.s{background:var(--pr);color:#fff}
.bt{background:var(--pr);color:#fff;border-radius:14px;padding:13px 18px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.bt.o{background:transparent;color:var(--pr);box-shadow:inset 0 0 0 1.5px var(--pr)}
.tl{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--pr);display:flex;align-items:center;justify-content:center;flex:none}
.rw{display:flex;gap:12px;align-items:center}
.rw>div:not(.tl):not(.av){flex:1;min-width:0}
.b{font-weight:700}
.mu{color:var(--mu);font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;border-bottom:1px solid var(--line);font-weight:700;margin-bottom:14px}
.tabs span{flex:1;text-align:center;padding:10px 0;color:var(--mu);white-space:nowrap}
.tabs .on{box-shadow:inset 0 -2px 0 var(--pr)}
.chips{display:flex;gap:7px;overflow:hidden}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--mu);white-space:nowrap;font-weight:500}
.chip.s{background:var(--pr);border-color:var(--pr);color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 0;text-align:center;font-size:12px;font-weight:500}
.slot.s{border-color:var(--pr);color:var(--pr);background:var(--soft)}
.slot.x{color:var(--mu);text-decoration:line-through;border-style:dashed}
.fd{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;gap:9px;align-items:center;margin:5px 0 12px}
.fd.f{border-color:var(--pr)}
.fd svg{color:var(--mu)}
.ok{background:var(--okb);color:var(--okt);border-radius:9px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.cta{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 18px;gap:12px}
.cta .bt:only-child{flex:1}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-24px;position:relative;padding:20px 18px 0}
.hero{border-radius:0}
.rb{position:absolute;top:20px;width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;z-index:1}
.tag{position:absolute;left:18px;bottom:36px;background:#111827;color:#fff;border-radius:9px;padding:4px 11px;font-size:11px;font-weight:500;z-index:1}
.h1{font-weight:700;font-size:19px;line-height:1.3;margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;padding:11px 0;text-align:center;background:var(--card)}
.stat b{display:block;font-size:16px}
.stat span{color:var(--mu);font-size:11.5px}
.prog{height:8px;border-radius:4px;background:var(--soft)}
.prog i{display:block;height:8px;border-radius:4px;background:var(--pr)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--mu);font-size:11.5px}
.wk i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:5px auto 0;box-sizing:border-box;font-style:normal}
.wk i svg{width:15px;height:15px}
.wk .d{background:var(--pr);color:#fff}.wk .r{background:var(--soft)}.wk .t{border:1.5px solid var(--pr)}.wk .e{border:1.5px dashed var(--line)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;text-align:center;color:var(--mu);font-size:10.5px}
.stamps i{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:3px;font-style:normal}
.stamps .d{background:var(--pr);color:#fff}.stamps .e{border:1.5px dashed var(--line);color:var(--mu)}
.pol{background:#fff;border-radius:7px;padding:6px 6px 20px;box-shadow:0 2px 8px rgba(17,24,39,.12)}
.pol div{aspect-ratio:1;border-radius:3px}
.qr{display:grid;background:#fff;padding:8px;border-radius:12px}
.qr i{background:#111827}
.qr i.o{background:transparent}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.tg{width:38px;height:22px;border-radius:11px;background:var(--pr);position:relative;flex:none}
.tg:after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tg.off{background:var(--line)}.tg.off:after{right:auto;left:3px}
.ctr{text-align:center}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.abt.open .clamp{-webkit-line-clamp:unset;display:block}
.pics{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pics>:first-child{grid-column:1/-1}
.abt.open .pics,.abt.show .pics{display:grid}
.pics .cv>svg{width:30px;height:30px}
.dk .pics{grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.dk .pics>:first-child{grid-column:auto}
.dk .pics .cv{height:130px!important}
.more{font:inherit;font-size:12.5px;font-weight:700;color:var(--pr);background:none;border:0;padding:6px 0 0;cursor:pointer}
.more:focus-visible{outline:2px solid var(--pr);outline-offset:2px;border-radius:4px}
.dim{position:absolute;inset:0;background:rgba(10,14,22,.55)}
.bs{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px 96px}
.bs:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
/* Desktop frames: drawn at 1160px and scaled down to fit the column. */
.dgrid{display:flex;flex-direction:column;gap:34px}
figure.dfig{width:100%;align-items:stretch}
figure.dfig figcaption{text-align:center}
.dwrap{width:100%;overflow:hidden}
.dk{width:1160px;transform-origin:0 0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:13px;line-height:1.45;box-sizing:border-box}
.dk svg{width:18px;height:18px;stroke-width:1.9;vertical-align:-3.5px;flex:none}
.dk .cv>svg{width:52px;height:52px;stroke-width:1.4}
.nav{display:flex;align-items:center;gap:24px;padding:13px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.nav .lk{display:flex;gap:6px;font-weight:500;color:var(--mu);font-size:13.5px;margin:0 auto}
.nav .lk span{padding:8px 16px;border-radius:10px}
.nav .lk .on{background:var(--soft);font-weight:700}
.dbody{width:1040px;margin:0 auto;padding:26px 0 36px}
.cols{display:grid;gap:22px;align-items:start}
.dh{font-weight:700;font-size:22px;margin:0 0 16px}
.dk .hd:first-child{margin-top:0}
.vt{display:flex;flex-direction:column;gap:4px}
.vt span{padding:10px 12px;border-radius:10px;font-weight:500;color:var(--mu)}
.vt .on{background:var(--soft);font-weight:700}
/* Admin: sidebar shell, capped content, table-style lists, sticky save bar. */
.ad{display:grid;grid-template-columns:226px 1fr;min-height:660px}
.sb{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.sb .gl{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;margin-bottom:4px}
.sb .it{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--mu);font-weight:500}
.sb .it.on{background:var(--soft);font-weight:700}
.am{padding:26px 30px 30px;display:flex;flex-direction:column;min-width:0}
.ac{width:100%;max-width:860px;margin:0 auto;flex:1}
.ah{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px}
.sbt{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.sbt.p{background:var(--pr);border-color:var(--pr);color:#fff}
.tr{display:grid;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line)}
.tr.h{border-top:0;color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-block:10px}
.tr>div{min-width:0}
.dk .tr .cv{border-radius:11px}
.dk .tr .cv>svg{width:20px;height:20px}
.gy{background:var(--line);color:var(--mu);border-radius:9px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.sv{margin:22px -30px -30px;padding:14px 30px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sw2{width:26px;height:26px;border-radius:50%;flex:none}
.cam{position:absolute;inset:0;background:#0B111C;color:#fff}
.cam .ab svg{color:#fff}
.vf{width:200px;height:200px;margin:54px auto 22px;position:relative}
.vf i{position:absolute;width:34px;height:34px;border:4px solid #FF8142}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ECP Hub screens in the Evenline direction</h1>
      <p class="lede">The first direction as the base: navy and white surfaces, one orange accent, a five-item bottom bar. Activities use the large cover card throughout. Events, people and activities here are invented samples.</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div class="sw" role="group" aria-label="Mockup font">
      <button id="f-manrope" type="button" aria-pressed="true">Manrope</button>
      <button id="f-noto" type="button" aria-pressed="false">Noto Sans JP</button>
    </div>
    <div class="sw" role="group" aria-label="Mockup theme">
      <button id="m-light" type="button" aria-pressed="true">Light</button>
      <button id="m-dark" type="button" aria-pressed="false">Dark</button>
    </div>
    </div>
  </header>
  <div class="board" id="board" data-m="light"></div>
</div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
const I=n=>`<i data-lucide="${n}"></i>`;
const C={key:['#6D5DFB','#3B2FB8'],yoga:['#FFB36B','#FF6F61'],coffee:['#B98558','#6A4330'],walk:['#5AA9FF','#3B5BDB'],step:['#34C6A0','#0E8F7A'],cup:['#FF7EB3','#D6336C'],quiz:['#9B8CFF','#5B3FD6'],trail:['#6C7BFF','#3D3BAA'],wall:['#FFC857','#F08A24'],draw:['#FF8A5B','#E8453C'],venue:['#4FB6C9','#22728A']};
const cv=(c,i,h,d,x='',cls='')=>`<div class="cv ${cls}" style="height:${h}px;background:linear-gradient(135deg,${C[c][0]},${C[c][1]})">${d?`<span class="dt"><b>${d[0]}</b>${d[1]}</span>`:''}${I(i)}${x}</div>`;
const bar=a=>`<div class="bar">${[['house','Home'],['calendar','Agenda'],['layout-grid','Activities'],['info','Info'],['user-round','Me']].map(([i,l])=>`<span class="${l===a?'on':''}">${I(i)}${l}</span>`).join('')}</div>`;
const ab=(t,r='',l='arrow-left')=>`<div class="ab">${I(l)}<span>${t}</span><span class="g">${r||'<span style="width:21px"></span>'}</span></div>`;
const hd=(t,l='')=>`<div class="hd"><span>${t}</span><em>${l}</em></div>`;
const big=o=>`<div class="card" style="${o.w?`width:${o.w}px;flex:none`:''}">${cv(o.c,o.i,o.h||104,o.d)}<div class="meta" style="margin-top:9px">${o.m}</div><div class="tt">${o.t}</div><div class="ft"><span class="meta">${I(o.pi||'map-pin')} ${o.p}</span><span class="pl ${o.s?'s':''}">${o.a}</span></div></div>`;
const fact=(i,t,s,r='')=>`<div class="rw"><div class="tl">${I(i)}</div><div><div class="b">${t}</div><div class="mu">${s}</div></div>${r}</div>`;
const row=(l,t,s,r='')=>`<div class="card rw" style="padding:10px 12px">${l}<div><div class="b">${t}</div><div class="mu">${s}</div></div>${r}</div>`;
const tile=i=>`<div class="tl">${I(i)}</div>`;
const av=t=>`<div class="av">${t}</div>`;
const chev=`<span style="color:var(--mu)">${I('chevron-right')}</span>`;
const hero=(c,i,tag,r='share-2')=>`${cv(c,i,170,null,`<span class="rb" style="left:18px">${I('arrow-left')}</span><span class="rb" style="right:18px">${I(r)}</span><span class="tag">${tag}</span>`,'hero')}`;
const cta=(a,b,btn)=>`<div class="cta">${a?`<div><div class="b" style="font-size:15px">${a}</div><div class="mu">${b}</div></div>`:''}<div class="bt">${btn}</div></div>`;
const tabs=(a,on)=>`<div class="tabs">${a.map(t=>`<span class="${t===on?'on':''}">${t}</span>`).join('')}</div>`;
const chips=(a)=>`<div class="chips">${a.map((t,i)=>`<span class="chip ${i?'':'s'}">${t}</span>`).join('')}</div>`;
const qr=px=>{let s='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7,g=(a,b)=>{const dx=x-a,dy=y-b;return dx==0||dx==6||dy==0||dy==6||(dx>1&&dx<5&&dy>1&&dy<5)};let on=f(0,0)?g(0,0):f(14,0)?g(14,0):f(0,14)?g(0,14):((x*7+y*13+x*y*3)%5<2);if((x==7&&y<8)||(y==7&&x<8)||(x==13&&y<8)||(y==7&&x>12)||(y==13&&x<8)||(x==7&&y>12))on=false;s+=`<i class="${on?'':'o'}"></i>`}return `<div class="qr" style="width:${px}px;height:${px}px;grid-template-columns:repeat(21,1fr);box-sizing:border-box">${s}</div>`};
const lang=`<span style="font-size:12px;font-weight:500;color:var(--mu)"><b class="on">EN</b> | BM</span>`;
const ticket=(sz)=>`<div style="border:2px solid var(--pr);border-radius:18px;background:var(--card);padding:12px" class="rw">${qr(sz)}<div><div class="b">Your event pass</div><div class="mu">Table 14, room 1208</div><div style="margin-top:7px"><span class="ok">${I('check')} Checked in 8:42 am</span></div></div></div>`;
const lbr=(n,i,t,p,me)=>`<div class="card rw" style="padding:9px 12px;${me?'border-color:var(--pr)':''}"><span class="b ${n<4?'on':''}" style="width:16px;text-align:center;${n<4?'':'color:var(--mu)'}">${n}</span>${av(i)}<div class="b">${t}</div><span class="b">${p}</span></div>`;

const abt=(t,p='',k='')=>{const l=p?'Read more and see photos':'Read more';return `<div class="abt ${k}"><div class="mu clamp" style="font-size:13px">${t}</div>${p?`<div class="pics">${p}</div>`:''}<button class="more" type="button" data-more data-l="${l}">${k==='open'?'Show less':l}</button></div>`};
const yt=`Start the day with a gentle 45-minute flow on the east deck, led by a local instructor as the sun comes up over the strait. All levels are welcome and no experience is needed. Mats, towels and water are provided, so come as you are in comfortable clothes. Sessions run in small groups of twelve. If it rains we move to the Garden Room on level 1, and you'll get a WhatsApp message 30 minutes before your slot either way.`;
